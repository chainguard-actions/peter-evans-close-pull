name: 'Close Pull'
description: 'A GitHub action to close a pull request and optionally delete its branch'
inputs:
  token:
    description: 'GITHUB_TOKEN or a repo scoped PAT'
    default: ${{ github.token }}
  repository:
    description: 'The GitHub repository containing the pull request'
    default: ${{ github.repository }}
  pull-request-number:
    description: 'The number of the pull request to close'
    default: ${{ github.event.number }}
  comment:
    description: 'A comment to make on the pull request before closing'
  delete-branch:
    description: 'Delete the pull request branch'
    default: false
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Set Parameters
      id: params
      shell: bash
      env:
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_DELETE_BRANCH: ${{ inputs.delete-branch }}
      run: |
        if [ -n "$INPUT_COMMENT" ]; then
          safe_comment=$(printf '%s' "$INPUT_COMMENT" | tr -d '\n\r')
          echo "comment=$safe_comment" >> "$GITHUB_OUTPUT"
        fi
        if [ "$INPUT_DELETE_BRANCH" = true ]; then
          echo "delete-branch=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Close Pull
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_PR_NUMBER: ${{ inputs.pull-request-number }}
        PARAM_COMMENT: ${{ steps.params.outputs.comment }}
        PARAM_DELETE_BRANCH: ${{ steps.params.outputs.delete-branch }}
      run: |
        args=()
        if [ -n "$PARAM_COMMENT" ]; then
          args+=(--comment "$PARAM_COMMENT")
        fi
        if [ "$PARAM_DELETE_BRANCH" = true ]; then
          args+=(--delete-branch)
        fi
        gh pr close -R "$INPUT_REPOSITORY" "${args[@]}" "$INPUT_PR_NUMBER"
branding:
  icon: 'git-pull-request'
  color: 'gray-dark'
