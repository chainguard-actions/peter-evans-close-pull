name: Test comment parameter logic
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Mock the gh CLI to capture args and verify --comment flag is passed
      - name: Mock gh CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/gh" << 'EOF'
          #!/bin/bash
          echo "mock gh called with args: $@"
          # Verify --comment flag is present
          FOUND_COMMENT=false
          for arg in "$@"; do
            if [ "$arg" = "--comment" ]; then
              FOUND_COMMENT=true
            fi
          done
          if [ "$FOUND_COMMENT" = "false" ]; then
            echo "FAIL: expected --comment flag in gh pr close args"
            exit 1
          fi
          echo "MOCK: gh pr close with --comment called successfully"
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          token: fake-token
          repository: owner/repo
          pull-request-number: '42'
          comment: 'This PR is being closed automatically.'
        env:
          GH_TOKEN: fake-token

      - name: Assert action completed with comment
        run: |
          echo "PASS: action completed with comment parameter"
