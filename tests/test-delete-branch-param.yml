name: Test delete-branch parameter logic
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Mock the gh CLI to capture args and verify --delete-branch flag is passed
      - name: Mock gh CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/gh" << 'EOF'
          #!/bin/bash
          echo "mock gh called with args: $@"
          # Verify --delete-branch flag is present
          FOUND_DELETE=false
          for arg in "$@"; do
            if [ "$arg" = "--delete-branch" ]; then
              FOUND_DELETE=true
            fi
          done
          if [ "$FOUND_DELETE" = "false" ]; then
            echo "FAIL: expected --delete-branch flag in gh pr close args"
            exit 1
          fi
          echo "MOCK: gh pr close with --delete-branch called successfully"
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          token: fake-token
          repository: owner/repo
          pull-request-number: '42'
          delete-branch: 'true'
        env:
          GH_TOKEN: fake-token

      - name: Assert action completed with delete-branch
        run: |
          echo "PASS: action completed with delete-branch parameter"
