name: Test close pull request with comment and branch deletion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock gh CLI
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/gh << 'EOF'
          #!/bin/sh
          # Record the call arguments
          echo "$@" > /tmp/gh-call-args.txt
          echo "mock gh called with: $@"
          # Simulate success
          exit 0
          EOF
          chmod +x /tmp/mock-bin/gh
          echo "/tmp/mock-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          repository: owner/repo
          pull-request-number: '123'
          comment: 'This PR is being closed and branch deleted'
          delete-branch: 'true'

      - name: Assert gh pr close was called with comment and delete-branch
        run: |
          echo "gh call args:"
          cat /tmp/gh-call-args.txt
          ARGS=$(cat /tmp/gh-call-args.txt)
          # Should contain 'pr close'
          if ! echo "$ARGS" | grep -q "pr close"; then
            echo "FAIL: expected 'pr close' in args"
            exit 1
          fi
          # Should contain the repository
          if ! echo "$ARGS" | grep -q "owner/repo"; then
            echo "FAIL: expected 'owner/repo' in args"
            exit 1
          fi
          # Should contain the PR number
          if ! echo "$ARGS" | grep -q "123"; then
            echo "FAIL: expected '123' in args"
            exit 1
          fi
          # Should contain --comment
          if ! echo "$ARGS" | grep -q "\-\-comment"; then
            echo "FAIL: expected '--comment' in args"
            exit 1
          fi
          # Should contain the comment text
          if ! echo "$ARGS" | grep -q "This PR is being closed and branch deleted"; then
            echo "FAIL: expected comment text in args"
            exit 1
          fi
          # Should contain --delete-branch
          if ! echo "$ARGS" | grep -q "\-\-delete-branch"; then
            echo "FAIL: expected '--delete-branch' in args"
            exit 1
          fi
          echo "PASS"
